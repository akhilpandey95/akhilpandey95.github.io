  <text x="1090" y="732" fill="#243454" font-size="18" font-weight="700">What I take from it</text>
  <text x="1090" y="758" fill="#475777" font-size="12">Exp3 is the best balanced checkpoint.</text>
  <text x="1090" y="778" fill="#475777" font-size="12">Exp4 is the cleanest contract, not the best classifier.</text>
  <text x="1090" y="798" fill="#475777" font-size="12">Exp5 proves naive class weighting can make the collapse sharper.</text>
